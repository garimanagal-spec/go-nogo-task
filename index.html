<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go/No-Go Task</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #eef5ff, #dfefff 60%, #c8dff8);
        margin: 0;
        padding: 0;
        color: #1f2d3d;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .container {
        width: min(86vw, 720px);
        background: white;
        padding: 28px;
        border-radius: 24px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
        text-align: center;
      }

      button {
        margin-top: 12px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #2d6cdf;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Go / No-Go Task</h1>
        <p>Choose the version that matches your device.</p>
        <p><strong>Computer:</strong> keyboard-based version</p>
        <p><strong>Mobile:</strong> tap-based version</p>
        <button onclick="window.location.href='computer.html'">Open Computer Version</button>
        <button onclick="window.location.href='mobile.html'">Open Mobile Version</button>
      </div>
    </div>

    <script>
      const isMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini/i.test(navigator.userAgent);
      if (isMobile) {
        window.location.replace('mobile.html');
      } else {
        window.location.replace('computer.html');
      }
    </script>
  </body>
</html>
